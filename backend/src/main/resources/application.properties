# Server
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:ziprun;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Seed data (data.sql)
spring.sql.init.mode=always

# H2 console (optional, dev only)
spring.h2.console.enabled=true

# Routing — switch at runtime via env var without restart
# Values: ruleBased | ai
routing.strategy=${ROUTING_STRATEGY:ruleBased}

# LLM — only needed when routing.strategy=ai
# Set LLM_API_KEY env var for Gemini/Groq; Ollama needs no key
llm.provider=${LLM_PROVIDER:groq}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:llama-3.1-8b-instant}
llm.base-url=${LLM_BASE_URL:https://api.groq.com}
llm.timeout-seconds=15
